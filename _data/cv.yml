      - position: Postdoctoral Research Associate
        company: Biocomplexity Institute, University of Virginia
        location: Charlottesville, VA, USA
        start_date: 2021
        end_date: 2024
        highlights:
          - |
            **A CyberInfrastructure for Network Engineering and Science (CINES)**

            - Developed graph analytics tools capable of large-scale computations (~10^6 nodes/edges) in a software as a service (SaaS) architecture using HPC backend.
            - Mentored a student in developing a financial contagion simulator using the Eisenberg-Noe model to evaluate the impact of bailout strategies in reducing cascading failures in bank lending networks.
          - |
            **AI Institute for Transforming Workforce & Decision Support (AgAID)**

            - Developed an explainable AI (XAI) framework for geospatial data using Shapley analysis in combination with supervised (random forest) and unsupervised (k-means clustering) learning. The framework was used to evaluate the impact of climate change on water availability and crop yield in the Western United States.
            - Designed and deployed a high performance computing pipeline for automated preprocessing, batch job submission, monitoring, and postprocessing of VIC-CropSyst simulation in UVA’s Rivanna HPC clusters
            - Mentored a student to develop an Asymmetric Nash Bargaining framework to model negotiations among California, Arizona, and Nevada to curtail the usage of Colorado River’s water.
            - Developed an integer linear programming (ILP) optimizer using Gurobi for matching buyers and sellers in bipartite networks representing river water rights markets.

      - position: Graduate Research Assistant
        company: Kansas State University
        location: Manhattan, KS, USA
        start_date: 2016
        end_date: 2021
        highlights:
          - |
            **Network Epidemic Models**

            - Designed and developed a hybrid compartmental agent-based model to simulate the spread of Zika virus using both vectored and sexual transmission mechanisms in a sexual contact network.
            - Developed a network epidemic model to simulate African Swine Fever (ASF) virus spread in US swine movement networks.
          - |
            **Graph Mining**

            - Designed a graph generation model to generate random graph for sexual contact among adult population based on agregate data on sexual behavior in the USA.
            - Designed a graph generation model that combines multiple aggregate datasets to produce animal movement graphs in the USA.
          - |
            **Machine Learning**

            - Developed a feature selection framework to improve the performance of predicting time series data for weekly dengue cases when training data is inadequate.
          - |
            **Blockchain**

            - Designed a blockchain-based distributed data management system for US beef cattle supply chains using Ethereum smart contracts.
          - |
            **Data Analytics as a Service**

            - Developed a web-based dashboard to visualize data, run simulations, and analyze results of dengue risk forecasts with a map interface using leaflet.js and PostGIS.

      - position: Senior Software Engineer
        company: Samsung R&D Institute Bangladesh
        location: Dhaka, Bangladesh
        start_date: 2013
        end_date: 2016
        highlights:
          - Led and managed a team of 5 to provide software quality assurance (SQA) for IoT applications in an Agile workflow. Deliverables included source code analysis, review, and unit/integration/compliance tests.
          - Developed an IoTivity-compliant client by expanding a Constrained Application Protocol (CoAP) framework to test protocol compliance of the IoTivity framework.
          - Implemented and maintained a TURN-based NAT traversal solution to establish peer to peer connections using relay servers to connect hosts to enable remote access and control of devices.
          - Developed test frameworks for unit and integration testing of Tizen mobile OS APIs.

